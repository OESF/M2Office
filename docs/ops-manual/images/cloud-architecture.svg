<svg viewBox="0 0 960 900" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="t d">
  <title id="t">クラウドの形の全体の構成</title>
  <desc id="d">外から順に、Xserver のパケットフィルター、機械のファイアウォール（ufw・国の遮断・CrowdSec の止める役）、入口の Caddy（証明書と WAF）と WireGuard を通る。奥に API・ワーカー・運営の API・SSH と update.sh があり、PostgreSQL とファイルを毎晩 m2office-backup が Google Cloud Storage へ送る。土台は Ubuntu 26.04 LTS。外部に Google・Gemini・Let's Encrypt・Cloud Storage・GitHub・地域の登録機関・CrowdSec の中央がある。</desc>
  <!-- 運営者マニュアル 第 18 章の図（仕様書 第23.8.16節「図」）。画面のヘルプでは <img> で出すので、スクリプトと外の読み込みは使わない -->
  <style>
    svg { --fg: #1d2430; --muted: #5a6475; --line: #c9cfd8; --surface: #ffffff; --ext: #eef0f3;
      --entry: #b4512d; --entry-soft: #fbece5; --guard: #9c2f6b; --guard-soft: #f8e6f0;
      --app: #1f6f68; --app-soft: #e3f3f0; --db: #4f46a5; --db-soft: #ecebfb;
      --bk: #2b63a8; --bk-soft: #e5eefa; --vpn: #a3650c; --vpn-soft: #fbf0dc; }
    @media (prefers-color-scheme: dark) {
      svg { --fg: #e6e9ee; --muted: #9aa3b2; --line: #3a4252; --surface: #1a1f28; --ext: #232a35;
        --entry: #f0a083; --entry-soft: #3a2219; --guard: #ec9ac5; --guard-soft: #3a1830;
        --app: #7fd3c7; --app-soft: #15302c; --db: #b3adf2; --db-soft: #25224a;
        --bk: #8db8f0; --bk-soft: #172a44; --vpn: #f2bd62; --vpn-soft: #3a2a10; }
    }
    text { font-family: "Hiragino Sans", "Hiragino Kaku Gothic ProN", "Yu Gothic", "Noto Sans JP", sans-serif; fill: var(--fg); }
    .ttl { font-size: 14px; font-weight: 700; }
    .sub { font-size: 12px; fill: var(--muted); }
    .mono { font-family: Menlo, Consolas, "DejaVu Sans Mono", monospace; font-size: 11px; fill: var(--muted); }
    rect { stroke-width: 1; }
    .b-out { fill: var(--surface); stroke: var(--line); }
    .b-ext { fill: var(--ext); stroke: var(--line); }
    .b-entry { fill: var(--entry-soft); stroke: var(--entry); }
    .b-guard { fill: var(--guard-soft); stroke: var(--guard); }
    .b-app { fill: var(--app-soft); stroke: var(--app); }
    .b-db { fill: var(--db-soft); stroke: var(--db); }
    .b-bk { fill: var(--bk-soft); stroke: var(--bk); }
    .b-vpn { fill: var(--vpn-soft); stroke: var(--vpn); }
    .vps { fill: none; stroke: var(--muted); stroke-dasharray: 5 4; }
    line { fill: none; }
    .a { stroke: var(--muted); stroke-width: 1.4; }
    .a-vpn { stroke: var(--vpn); stroke-width: 1.8; }
    .a-bk { stroke: var(--bk); stroke-width: 1.8; }
    .a-guard { stroke: var(--guard); stroke-width: 1.6; stroke-dasharray: 4 3; }
    .h { fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
    .h-a { stroke: var(--muted); } .h-vpn { stroke: var(--vpn); } .h-bk { stroke: var(--bk); } .h-guard { stroke: var(--guard); }
  </style>
  <defs>
    <marker id="m" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="h h-a" d="M2 1L8 5L2 9"/></marker>
    <marker id="mv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="h h-vpn" d="M2 1L8 5L2 9"/></marker>
    <marker id="mb" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="h h-bk" d="M2 1L8 5L2 9"/></marker>
    <marker id="mg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path class="h h-guard" d="M2 1L8 5L2 9"/></marker>
  </defs>

  <!-- 使う人 -->
  <rect class="b-out" x="40" y="20" width="200" height="56" rx="8"/>
  <text class="ttl" x="140" y="43" text-anchor="middle">会社の利用者</text>
  <text class="sub" x="140" y="63" text-anchor="middle">会社名.m2office.net</text>
  <rect class="b-out" x="270" y="20" width="200" height="56" rx="8"/>
  <text class="ttl" x="370" y="43" text-anchor="middle">見込み客</text>
  <text class="sub" x="370" y="63" text-anchor="middle">m2office.net の紹介</text>
  <rect class="b-vpn" x="525" y="20" width="200" height="56" rx="8"/>
  <text class="ttl" x="625" y="43" text-anchor="middle">運営者の端末</text>
  <text class="sub" x="625" y="63" text-anchor="middle">WireGuard の鍵を登録</text>

  <line class="a" x1="140" y1="78" x2="140" y2="108" marker-end="url(#m)"/>
  <line class="a" x1="370" y1="78" x2="370" y2="108" marker-end="url(#m)"/>
  <line class="a-vpn" x1="625" y1="78" x2="625" y2="108" marker-end="url(#mv)"/>

  <!-- VPS の外の守り -->
  <rect class="b-ext" x="30" y="110" width="900" height="44" rx="8"/>
  <text class="ttl" x="480" y="129" text-anchor="middle">Xserver のパケットフィルター（VPS の外）</text>
  <text class="sub" x="480" y="146" text-anchor="middle">通すのは TCP 80・443 と UDP 51820 だけ</text>

  <line class="a" x1="140" y1="156" x2="140" y2="196" marker-end="url(#m)"/>
  <line class="a" x1="370" y1="156" x2="370" y2="196" marker-end="url(#m)"/>
  <line class="a-vpn" x1="625" y1="156" x2="625" y2="196" marker-end="url(#mv)"/>

  <rect class="vps" x="30" y="172" width="900" height="618" rx="18"/>

  <!-- 機械のファイアウォール -->
  <rect class="b-guard" x="50" y="198" width="860" height="50" rx="8"/>
  <text class="ttl" x="480" y="218" text-anchor="middle">機械のファイアウォール（nftables）</text>
  <text class="sub" x="480" y="237" text-anchor="middle">ufw（80・443・51820 だけ開ける）・国の遮断（中国・ロシア・北朝鮮。入る・出る）・CrowdSec の止める役</text>

  <line class="a" x1="140" y1="250" x2="140" y2="278" marker-end="url(#m)"/>
  <line class="a" x1="370" y1="250" x2="370" y2="278" marker-end="url(#m)"/>
  <line class="a-vpn" x1="625" y1="250" x2="625" y2="278" marker-end="url(#mv)"/>
  <line class="a-guard" x1="825" y1="278" x2="825" y2="252" marker-end="url(#mg)"/>

  <!-- 入口 -->
  <rect class="b-entry" x="50" y="280" width="470" height="76" rx="8"/>
  <text class="ttl" x="285" y="302" text-anchor="middle">入口: Caddy</text>
  <text class="sub" x="285" y="322" text-anchor="middle">証明書（Let's Encrypt）・名前で行き先を分ける・画面と紹介のページ</text>
  <text class="sub" x="285" y="341" text-anchor="middle">WAF: Coraza ＋ OWASP の規則（CRS）</text>
  <rect class="b-vpn" x="540" y="280" width="170" height="76" rx="8"/>
  <text class="ttl" x="625" y="310" text-anchor="middle">WireGuard</text>
  <text class="sub" x="625" y="330" text-anchor="middle">wg0・10.66.0.1</text>
  <rect class="b-guard" x="740" y="280" width="170" height="76" rx="8"/>
  <text class="ttl" x="825" y="302" text-anchor="middle">CrowdSec</text>
  <text class="sub" x="825" y="322" text-anchor="middle">入口と SSH の記録を読む</text>
  <text class="sub" x="825" y="341" text-anchor="middle">攻撃する相手を決める</text>
  <line class="a-vpn" x1="538" y1="318" x2="524" y2="318" marker-end="url(#mv)"/>

  <line class="a" x1="125" y1="358" x2="125" y2="388" marker-end="url(#m)"/>
  <line class="a-vpn" x1="455" y1="358" x2="455" y2="388" marker-end="url(#mv)"/>
  <line class="a-vpn" x1="627" y1="358" x2="627" y2="388" marker-end="url(#mv)"/>

  <!-- M2Office のプログラムと保守 -->
  <rect class="b-app" x="50" y="390" width="150" height="68" rx="8"/>
  <text class="ttl" x="125" y="412" text-anchor="middle">API</text>
  <text class="sub" x="125" y="431" text-anchor="middle">画面と外部の窓口</text>
  <text class="mono" x="125" y="448" text-anchor="middle">127.0.0.1:3101</text>
  <rect class="b-app" x="215" y="390" width="150" height="68" rx="8"/>
  <text class="ttl" x="290" y="412" text-anchor="middle">ワーカー</text>
  <text class="sub" x="290" y="431" text-anchor="middle">見回り・定期・AI</text>
  <text class="sub" x="290" y="448" text-anchor="middle">外からは受けない</text>
  <rect class="b-app" x="380" y="390" width="150" height="68" rx="8"/>
  <text class="ttl" x="455" y="412" text-anchor="middle">運営の API</text>
  <text class="sub" x="455" y="431" text-anchor="middle">マスター管理画面</text>
  <text class="mono" x="455" y="448" text-anchor="middle">127.0.0.1:3102</text>
  <rect class="b-vpn" x="545" y="390" width="165" height="68" rx="8"/>
  <text class="ttl" x="627" y="412" text-anchor="middle">SSH</text>
  <text class="sub" x="627" y="431" text-anchor="middle">VPN の網からだけ</text>
  <text class="sub" x="627" y="448" text-anchor="middle">更新と紹介のページ</text>
  <rect class="b-vpn" x="740" y="390" width="170" height="68" rx="8"/>
  <text class="ttl" x="825" y="412" text-anchor="middle">update.sh</text>
  <text class="sub" x="825" y="431" text-anchor="middle">リリースのタグを入れる</text>
  <text class="sub" x="825" y="448" text-anchor="middle">前に控え・失敗で戻す</text>
  <line class="a-vpn" x1="712" y1="424" x2="736" y2="424" marker-end="url(#mv)"/>

  <line class="a" x1="125" y1="460" x2="125" y2="488" marker-end="url(#m)"/>
  <line class="a" x1="290" y1="460" x2="290" y2="488" marker-end="url(#m)"/>
  <line class="a" x1="455" y1="460" x2="455" y2="488" marker-end="url(#m)"/>
  <line class="a-vpn" x1="825" y1="460" x2="825" y2="488" marker-end="url(#mv)"/>

  <!-- データ -->
  <rect class="b-db" x="50" y="490" width="480" height="60" rx="8"/>
  <text class="ttl" x="290" y="513" text-anchor="middle">PostgreSQL 17 ＋ pgvector</text>
  <text class="sub" x="290" y="533" text-anchor="middle">会社ごとに分けたデータ・画面／移行／運営で接続の権限を分ける</text>
  <rect class="b-db" x="545" y="490" width="165" height="60" rx="8"/>
  <text class="ttl" x="627" y="513" text-anchor="middle">ファイル</text>
  <text class="mono" x="627" y="533" text-anchor="middle">/var/lib/m2office</text>
  <rect class="b-bk" x="740" y="490" width="170" height="60" rx="8"/>
  <text class="ttl" x="825" y="513" text-anchor="middle">更新の前の控え</text>
  <text class="sub" x="825" y="533" text-anchor="middle">pg_dump・直近 3 回</text>

  <line class="a-bk" x1="290" y1="552" x2="290" y2="580" marker-end="url(#mb)"/>
  <line class="a-bk" x1="627" y1="552" x2="627" y2="580" marker-end="url(#mb)"/>

  <!-- 控えと定期の仕事 -->
  <rect class="b-bk" x="50" y="582" width="660" height="78" rx="8"/>
  <text class="ttl" x="380" y="605" text-anchor="middle">社外の控え: m2office-backup（毎晩 2 時すぎ）</text>
  <text class="sub" x="380" y="625" text-anchor="middle">データベース: pgBackRest（まるごとを 14 日分・変更の記録を 5 分ごと）</text>
  <text class="sub" x="380" y="644" text-anchor="middle">ファイル: restic（30 日分）・月に 1 回、壊れていないかを確かめる</text>
  <rect class="b-guard" x="740" y="582" width="170" height="78" rx="8"/>
  <text class="ttl" x="825" y="605" text-anchor="middle">国の一覧の更新</text>
  <text class="mono" x="825" y="625" text-anchor="middle">m2office-geo-update</text>
  <text class="sub" x="825" y="644" text-anchor="middle">週に 1 回取り直す</text>

  <!-- OS の土台 -->
  <rect class="b-ext" x="50" y="678" width="860" height="62" rx="8"/>
  <text class="ttl" x="480" y="701" text-anchor="middle">OS の土台: Ubuntu 26.04 LTS・systemd・Node.js 24</text>
  <text class="sub" x="480" y="722" text-anchor="middle">自動のセキュリティの更新（4 時半に再起動）・auditd（作業の記録）・journald（28 日分）・スワップ 4 GB</text>

  <text class="ttl" x="50" y="772">Xserver の VPS（国内）</text>

  <line class="a" x1="100" y1="792" x2="100" y2="826" marker-end="url(#m)"/>
  <line class="a" x1="228" y1="792" x2="228" y2="826" marker-end="url(#m)"/>
  <line class="a" x1="356" y1="792" x2="356" y2="826" marker-end="url(#m)"/>
  <line class="a-bk" x1="484" y1="792" x2="484" y2="826" marker-end="url(#mb)"/>
  <line class="a" x1="612" y1="792" x2="612" y2="826" marker-end="url(#m)"/>
  <line class="a" x1="740" y1="792" x2="740" y2="826" marker-end="url(#m)"/>
  <line class="a" x1="868" y1="792" x2="868" y2="826" marker-end="url(#m)"/>

  <!-- 外部 -->
  <rect class="b-ext" x="40" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="100" y="851" text-anchor="middle">Google</text>
  <text class="sub" x="100" y="871" text-anchor="middle">ログイン・連携</text>
  <rect class="b-ext" x="168" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="228" y="851" text-anchor="middle">Gemini</text>
  <text class="sub" x="228" y="871" text-anchor="middle">AI の推論</text>
  <rect class="b-ext" x="296" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="356" y="851" text-anchor="middle">Let's Encrypt</text>
  <text class="sub" x="356" y="871" text-anchor="middle">証明書</text>
  <rect class="b-bk" x="424" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="484" y="851" text-anchor="middle">Cloud Storage</text>
  <text class="sub" x="484" y="871" text-anchor="middle">東京・社外の控え</text>
  <rect class="b-ext" x="552" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="612" y="851" text-anchor="middle">GitHub</text>
  <text class="sub" x="612" y="871" text-anchor="middle">リリースのタグ</text>
  <rect class="b-ext" x="680" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="740" y="851" text-anchor="middle">地域の登録機関</text>
  <text class="sub" x="740" y="871" text-anchor="middle">国のアドレス</text>
  <rect class="b-ext" x="808" y="828" width="120" height="56" rx="8"/>
  <text class="ttl" x="868" y="851" text-anchor="middle">CrowdSec</text>
  <text class="sub" x="868" y="871" text-anchor="middle">攻撃元の共有</text>
</svg>
