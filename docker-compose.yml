services:
  db:
    # 知識の意味の検索（仕様書 第11.7.6節）のため、pgvector を含む PostgreSQL 17 を使う
    image: pgvector/pgvector:pg17
    container_name: m2office-db
    environment:
      POSTGRES_USER: m2office
      POSTGRES_PASSWORD: m2office
      POSTGRES_DB: m2office
    ports:
      - "${DB_PORT:-3105}:5432"
    volumes:
      - m2office-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U m2office"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  m2office-db-data:
